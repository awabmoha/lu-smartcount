<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>LU SmartCount system design</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C734B"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00284a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#F4F5F7"/>

  <!-- Camera -->
  <g filter="url(#shadow)">
    <rect x="30" y="170" width="190" height="150" rx="18" fill="#fff"/>
  </g>
  <text x="125" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#004876">Camera</text>
  <g transform="translate(52,222) scale(0.85)" fill="none" stroke="#004876" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6.5"/><circle cx="12" cy="10" r="2.4"/><path d="M12 16.5V20M7.5 21h9"/></g>
  <text x="82" y="237" font-size="15" fill="#4b5560">USB webcam</text>
  <g transform="translate(52,252) scale(0.85)" fill="none" stroke="#004876" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></g>
  <text x="82" y="267" font-size="15" fill="#4b5560">Phone camera</text>
  <g transform="translate(52,282) scale(0.85)" fill="none" stroke="#004876" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></g>
  <text x="82" y="297" font-size="15" fill="#4b5560">Demo video</text>

  <!-- Counter on the laptop -->
  <g filter="url(#shadow)">
    <rect x="270" y="60" width="430" height="370" rx="20" fill="#fff"/>
  </g>
  <rect x="270" y="60" width="430" height="8" rx="4" fill="#BE9C79"/>
  <text x="485" y="104" text-anchor="middle" font-size="21" font-weight="700" fill="#004876">Counter (on the laptop)</text>
  <text x="485" y="128" text-anchor="middle" font-size="14" fill="#8C734B">runs locally · no internet needed</text>

  <rect x="300" y="150" width="370" height="64" rx="12" fill="#E5EEF5"/>
  <text x="320" y="178" font-size="17" font-weight="700" fill="#004876">1  Detect people</text>
  <text x="320" y="200" font-size="14" fill="#4b5560">RT-DETR AI model, about 5 frames per second</text>

  <rect x="300" y="228" width="370" height="64" rx="12" fill="#E5EEF5"/>
  <text x="320" y="256" font-size="17" font-weight="700" fill="#004876">2  Follow each person</text>
  <text x="320" y="278" font-size="14" fill="#4b5560">ByteTrack tracker gives short-lived IDs</text>

  <rect x="300" y="306" width="370" height="64" rx="12" fill="#E5EEF5"/>
  <text x="320" y="334" font-size="17" font-weight="700" fill="#004876">3  Count line crossings</text>
  <text x="320" y="356" font-size="14" fill="#4b5560">in / out across the entrance line</text>

  <text x="485" y="404" text-anchor="middle" font-size="14" fill="#8C734B">Live picture kept in memory only · never saved</text>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="750" y="170" width="190" height="150" rx="18" fill="#004876"/>
  </g>
  <text x="845" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Server</text>
  <text x="845" y="244" text-anchor="middle" font-size="15" fill="#d9e6f0">stores crossings,</text>
  <text x="845" y="266" text-anchor="middle" font-size="15" fill="#d9e6f0">times and coverage</text>
  <text x="845" y="288" text-anchor="middle" font-size="15" fill="#d9e6f0">FastAPI · database</text>

  <!-- Outputs -->
  <g filter="url(#shadow)">
    <rect x="990" y="60" width="185" height="110" rx="16" fill="#fff"/>
    <rect x="990" y="205" width="185" height="110" rx="16" fill="#fff"/>
    <rect x="990" y="350" width="185" height="110" rx="16" fill="#fff"/>
  </g>
  <text x="1082" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#004876">Staff app</text>
  <text x="1082" y="128" text-anchor="middle" font-size="14" fill="#4b5560">live, analytics,</text>
  <text x="1082" y="148" text-anchor="middle" font-size="14" fill="#4b5560">setup in the browser</text>
  <text x="1082" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#004876">Visitor screen</text>
  <text x="1082" y="273" text-anchor="middle" font-size="14" fill="#4b5560">Arabic and English,</text>
  <text x="1082" y="293" text-anchor="middle" font-size="14" fill="#4b5560">updates every second</text>
  <text x="1082" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#004876">Reports</text>
  <text x="1082" y="418" text-anchor="middle" font-size="14" fill="#4b5560">PDF · Excel · CSV</text>
  <text x="1082" y="438" text-anchor="middle" font-size="14" fill="#4b5560">any period</text>

  <!-- Arrows -->
  <line x1="220" y1="245" x2="296" y2="245" stroke="#8C734B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="245" x2="746" y2="245" stroke="#8C734B" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="723" y="232" text-anchor="middle" font-size="12" fill="#8C734B">crossings</text>
  <text x="723" y="268" text-anchor="middle" font-size="12" fill="#8C734B">only</text>
  <path d="M845 170 V 133 Q 845 115 863 115 H 986" fill="none" stroke="#8C734B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="940" y1="260" x2="986" y2="260" stroke="#8C734B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M845 320 V 387 Q 845 405 863 405 H 986" fill="none" stroke="#8C734B" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="495" text-anchor="middle" font-size="15" fill="#4b5560">No video, images or identities are stored. The only data kept is "someone crossed in/out at this time".</text>
</svg>
